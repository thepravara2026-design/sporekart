openapi: 3.0.3
info:
  title: SporeKart Enterprise Customer Copilot Service
  description: Enterprise AI Shopping & Support Assistant API for the SporeKart platform. Provides chat, recommendations, product search, order tracking, training guidance, and knowledge retrieval capabilities through a conversational AI interface.
  version: 0.2.0
  contact:
    name: SporeKart Engineering
    email: engineering@sporekart.com
    url: https://sporekart.com
  license:
    name: Proprietary
    url: https://sporekart.com/license

servers:
  - url: https://api.sporekart.com
    description: Production API gateway
  - url: https://staging.api.sporekart.com
    description: Staging API gateway
  - url: http://localhost:8099
    description: Local development

security:
  - bearerAuth: []

paths:
  /api/v1/copilot/customer/chat:
    post:
      tags:
        - Chat
      summary: Process a chat message
      description: Sends a user message to the Customer Copilot and returns a synchronous response with optional follow-up suggestions.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/copilot/customer/stream:
    post:
      tags:
        - Chat
      summary: Stream a chat response
      description: Sends a user message and receives a streaming response via Server-Sent Events (SSE). Events include context, tokens, suggestions, and completion signals.
      operationId: streamChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of response tokens
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE event stream
                example: |
                  event: context
                  data: {"sessionId":"sess_abc123","pageContext":"/products","userInfo":{},"cartInfo":{}}

                  event: token
                  data: {"token":"I"}

                  event: token
                  data: {"token":" recommend"}

                  event: suggestions
                  data: {"suggestions":[{"label":"Filter","action":"filter","payload":{}}]}

                  event: complete
                  data: {"sessionId":"sess_abc123"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/copilot/customer/history:
    get:
      tags:
        - Conversation
      summary: Get conversation history
      description: Retrieves the full message history for a given session.
      operationId: getConversationHistory
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Session identifier
      responses:
        '200':
          description: Conversation history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/copilot/customer/recommend:
    post:
      tags:
        - Recommendations
      summary: Get product recommendations
      description: Returns personalized product recommendations based on customer profile, purchase history, seasonal context, and location.
      operationId: getRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Recommendations returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/copilot/customer/context:
    post:
      tags:
        - Context
      summary: Assemble session context
      description: Assembles and returns the full context for a user session including profile, cart, orders, and recent activity.
      operationId: assembleContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRequest'
      responses:
        '200':
          description: Context assembled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/copilot/customer/products:
    post:
      tags:
        - Products
      summary: Search products
      description: Searches the product catalog with optional filters for category, price range, and sorting.
      operationId: searchProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchRequest'
      responses:
        '200':
          description: Search results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/copilot/customer/feedback:
    post:
      tags:
        - Feedback
      summary: Submit feedback
      description: Submits user feedback on a copilot response for quality monitoring and improvement.
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/copilot/customer/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the Customer Copilot service and its downstream dependencies.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: The request payload is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is required or failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SessionNotFound:
      description: The specified session was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: An unexpected error occurred
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    # ─── Request Schemas ────────────────────────────────────────

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User's message
          minLength: 1
          maxLength: 4000
          example: show me oyster mushrooms
        sessionId:
          type: string
          description: Existing session ID (omit for new session)
          example: sess_abc123
        pageUrl:
          type: string
          description: Current page URL for context
          format: uri
          example: https://sporekart.com/products
        pageTitle:
          type: string
          description: Current page title
          example: Products
        section:
          type: string
          description: Current section or category
          example: mushroom-spawn
        entityType:
          type: string
          description: Type of entity being viewed
          example: product
        entityId:
          type: string
          description: Identifier of entity being viewed
          example: prod_456

    RecommendRequest:
      type: object
      required:
        - customerId
      properties:
        customerId:
          type: string
          description: Customer identifier
          example: cust_789
        category:
          type: string
          description: Category filter for recommendations
          example: mushroom-spawn
        context:
          type: string
          description: Recommendation context (product_page, cart, home)
          example: product_page
        limit:
          type: integer
          description: Maximum number of recommendations
          minimum: 1
          maximum: 50
          default: 10
          example: 5
        excludeProductIds:
          type: array
          description: Product IDs to exclude from results
          items:
            type: string
          example: ["prod_123", "prod_456"]

    ContextRequest:
      type: object
      required:
        - sessionId
        - customerId
      properties:
        sessionId:
          type: string
          description: Session identifier
          example: sess_abc123
        customerId:
          type: string
          description: Customer identifier
          example: cust_789
        pageUrl:
          type: string
          description: Current page URL
          format: uri
          example: https://sporekart.com/products/oyster-spawn
        pageTitle:
          type: string
          description: Current page title
          example: Oyster Mushroom Spawn

    ProductSearchRequest:
      type: object
      properties:
        query:
          type: string
          description: Search query
          example: oyster mushroom
        category:
          type: string
          description: Category filter
          example: spawn
        minPrice:
          type: number
          description: Minimum price filter
          minimum: 0
          example: 100
        maxPrice:
          type: number
          description: Maximum price filter
          minimum: 0
          example: 5000
        sortBy:
          type: string
          description: Sort field
          enum: [relevance, price_asc, price_desc, name_asc, rating]
          default: relevance
          example: relevance
        page:
          type: integer
          description: Page number (zero-indexed)
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          description: Page size
          minimum: 1
          maximum: 100
          default: 20
          example: 20

    FeedbackRequest:
      type: object
      required:
        - sessionId
        - rating
      properties:
        sessionId:
          type: string
          description: Session identifier
          example: sess_abc123
        messageId:
          type: string
          description: Message identifier
          example: msg_002
        rating:
          type: string
          description: Feedback rating
          enum: [helpful, neutral, unhelpful]
          example: helpful
        feedback:
          type: string
          description: Free-text feedback
          maxLength: 2000
          example: Great recommendations, very accurate
        metadata:
          type: object
          description: Additional context
          properties:
            intent:
              type: string
              example: product_search
            capability:
              type: string
              example: Product Search & Discovery

    # ─── Response Schemas ───────────────────────────────────────

    ChatResponse:
      type: object
      required:
        - sessionId
        - message
      properties:
        sessionId:
          type: string
          description: Session identifier
          example: sess_abc123
        message:
          type: string
          description: Copilot response message
          example: I found 12 oyster mushroom products...
        suggestions:
          type: array
          description: Follow-up action suggestions
          items:
            $ref: '#/components/schemas/Suggestion'
        context:
          type: object
          description: Session context metadata
          example: { "sessionId": "sess_abc123", "cartCount": 0 }
        streaming:
          type: boolean
          description: Whether the response was streamed
          default: false

    ConversationHistoryResponse:
      type: object
      required:
        - sessionId
        - messages
      properties:
        sessionId:
          type: string
          description: Session identifier
          example: sess_abc123
        messages:
          type: array
          description: Ordered list of conversation messages
          items:
            $ref: '#/components/schemas/ConversationMessage'

    RecommendResponse:
      type: object
      required:
        - recommendations
      properties:
        recommendations:
          type: array
          description: Scored product recommendations
          items:
            $ref: '#/components/schemas/ProductRecommendation'
        recommendationType:
          type: string
          description: Dominant recommendation strategy type
          enum: [PERSONALIZED, CONTEXT_AWARE, SEASONAL, LOCATION_AWARE, CROSS_SELL, UPSELL, GENERAL]
          example: PERSONALIZED
        explanation:
          type: string
          description: Human-readable explanation of recommendations
          example: Recommended based on your profile and seasonal availability

    ContextResponse:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: Session identifier
          example: sess_abc123
        pageContext:
          type: string
          description: Current page URL
          example: /products/oyster-spawn
        userInfo:
          type: object
          description: User profile and journey stage
          properties:
            userId:
              type: string
              example: cust_789
            userName:
              type: string
              example: Rajesh Kumar
            email:
              type: string
              format: email
              example: rajesh@example.com
            preferredLanguage:
              type: string
              example: en
            journeyStage:
              type: string
              enum: [new, browsing, checkout, returning]
              example: browsing
        cartInfo:
          type: object
          description: Cart contents and totals
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ShoppingCartItem'
            itemCount:
              type: integer
              example: 2
            totalPrice:
              type: number
              example: 598.0
        recentActivity:
          type: object
          description: Recent user activity
          properties:
            recentOrders:
              type: array
              items:
                $ref: '#/components/schemas/CustomerOrder'
            viewedProducts:
              type: array
              items:
                type: string
              example: ["prod_123", "prod_456"]
            conversationLength:
              type: integer
              example: 5

    ProductSearchResponse:
      type: object
      required:
        - products
        - totalResults
        - page
        - size
      properties:
        products:
          type: array
          description: Product search results
          items:
            $ref: '#/components/schemas/ProductItem'
        totalResults:
          type: integer
          description: Total number of matching results
          example: 15
        page:
          type: integer
          description: Current page number
          example: 0
        size:
          type: integer
          description: Page size
          example: 20

    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          description: Overall health status
          enum: [UP, DEGRADED, DOWN]
          example: UP
        service:
          type: string
          description: Service name
          example: customer-copilot-service
        version:
          type: string
          description: Service version
          example: 0.2.0
        uptime:
          type: integer
          description: Service uptime in seconds
          example: 3600
        dependencies:
          type: object
          description: Downstream service health status
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [UP, DEGRADED, DOWN, UNKNOWN]
              latencyMs:
                type: integer
                example: 45
          example:
            catalog-service: { status: UP, latencyMs: 45 }
            order-service: { status: UP, latencyMs: 32 }

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Feedback recorded

    # ─── Domain Models ──────────────────────────────────────────

    Suggestion:
      type: object
      required:
        - label
        - action
      properties:
        label:
          type: string
          description: Display label for the suggestion
          example: Filter by price range
        action:
          type: string
          description: Action identifier
          example: filter
        payload:
          type: object
          description: Action payload
          example: { "field": "price", "type": "range" }

    ConversationMessage:
      type: object
      required:
        - id
        - role
        - content
      properties:
        id:
          type: string
          description: Message identifier
          example: msg_001
        role:
          type: string
          description: Message role
          enum: [user, assistant, system]
          example: user
        content:
          type: string
          description: Message content
          example: show me oyster mushrooms
        metadata:
          type: object
          description: Message metadata
          example: { "pageUrl": "/products" }
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: "2026-07-23T10:30:00+05:30"

    ProductItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Product identifier
          example: prod_789
        name:
          type: string
          description: Product name
          example: Oyster Mushroom Spawn (100g)
        description:
          type: string
          description: Product description
          example: High-quality spawn for oyster mushroom cultivation
        category:
          type: string
          description: Product category
          example: mushroom-spawn
        price:
          type: number
          description: Product price
          example: 299.0
        currency:
          type: string
          description: Currency code
          example: INR
        imageUrl:
          type: string
          format: uri
          description: Product image URL
          example: https://cdn.sporekart.com/spawn/oyster-100g.jpg
        stockLevel:
          type: integer
          description: Current stock level
          example: 120
        isAvailable:
          type: boolean
          description: Whether the product is available for purchase
          example: true
        rating:
          type: number
          description: Average product rating (0-5)
          minimum: 0
          maximum: 5
          example: 4.7
        tags:
          type: array
          description: Product tags
          items:
            type: string
          example: ["oyster", "spawn", "beginner"]

    ProductRecommendation:
      type: object
      required:
        - product
        - score
      properties:
        product:
          $ref: '#/components/schemas/ProductItem'
        score:
          type: number
          description: Recommendation score (0-100)
          minimum: 0
          maximum: 100
          example: 92
        reason:
          type: string
          description: Human-readable reason for recommendation
          example: Great for beginners and perfect for the current growing season
        recommendationType:
          type: string
          description: Strategy that produced this recommendation
          enum: [PERSONALIZED, CONTEXT_AWARE, SEASONAL, LOCATION_AWARE, CROSS_SELL, UPSELL, GENERAL]
          example: PERSONALIZED

    CustomerOrder:
      type: object
      required:
        - orderId
        - customerId
      properties:
        orderId:
          type: string
          description: Order identifier
          example: SPK-2024-07842
        customerId:
          type: string
          description: Customer identifier
          example: cust_789
        items:
          type: array
          description: Order items
          items:
            $ref: '#/components/schemas/ShoppingCartItem'
        status:
          type: string
          description: Order status
          enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, RETURNED]
          example: SHIPPED
        totalAmount:
          type: number
          description: Order total
          example: 1646.0
        currency:
          type: string
          description: Currency code
          example: INR
        placedAt:
          type: string
          format: date-time
          description: Order placement timestamp
          example: "2026-07-20T14:30:00+05:30"
        estimatedDelivery:
          type: string
          format: date-time
          description: Estimated delivery date
          example: "2026-07-25T18:00:00+05:30"
        trackingUrl:
          type: string
          format: uri
          description: Tracking URL
          example: https://track.sporekart.com/SPK-2024-07842

    ShoppingCartItem:
      type: object
      required:
        - productId
      properties:
        productId:
          type: string
          description: Product identifier
          example: prod_456
        productName:
          type: string
          description: Product name
          example: Oyster Spawn
        quantity:
          type: integer
          description: Quantity
          minimum: 1
          example: 2
        unitPrice:
          type: number
          description: Unit price
          example: 299.0
        totalPrice:
          type: number
          description: Total price (quantity * unitPrice)
          example: 598.0

    CustomerProfile:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User identifier
          example: cust_789
        userName:
          type: string
          description: User display name
          example: Rajesh Kumar
        email:
          type: string
          format: email
          description: Email address
          example: rajesh@example.com
        preferredLanguage:
          type: string
          description: Preferred language code
          example: en
        preferences:
          type: object
          description: User preferences
          example: { "categories": ["oyster", "button"], "priceRange": { "min": 100, "max": 5000 } }
        joinedAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2026-01-15T09:00:00+05:30"

    TrainingCourse:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Course identifier
          example: course_101
        title:
          type: string
          description: Course title
          example: Mushroom Cultivation 101
        description:
          type: string
          description: Course description
          example: Learn the fundamentals of mushroom cultivation
        category:
          type: string
          description: Course category
          example: cultivation
        level:
          type: string
          description: Course level
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          example: BEGINNER
        duration:
          type: string
          description: Course duration
          example: 4 weeks
        instructor:
          type: string
          description: Instructor name
          example: Dr. Priya Sharma
        nextBatchDate:
          type: string
          format: date-time
          description: Next batch start date
          example: "2026-08-05T10:00:00+05:30"
        enrollmentStatus:
          type: string
          description: Enrollment status
          enum: [OPEN, CLOSED, WAITLIST]
          example: OPEN

    KnowledgeArticle:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Article identifier
          example: kb_001
        title:
          type: string
          description: Article title
          example: How to Grow Shiitake Mushrooms
        snippet:
          type: string
          description: Article snippet
          example: Shiitake mushrooms grow best on hardwood logs...
        content:
          type: string
          description: Full article content
          example: Step-by-step guide to growing shiitake mushrooms...
        category:
          type: string
          description: Article category
          example: cultivation-guides
        source:
          type: string
          description: Source of the article
          example: SporeKart Knowledge Base
        relevanceScore:
          type: number
          description: Relevance score (0-1)
          minimum: 0
          maximum: 1
          example: 0.95
        url:
          type: string
          format: uri
          description: Article URL
          example: https://sporekart.com/knowledge/shiitake-guide

    # ─── Common Schemas ─────────────────────────────────────────

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the error type
          example: https://api.sporekart.com/errors/bad-request
        title:
          type: string
          description: Short error title
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Detailed error message
          example: message must not be blank
        instance:
          type: string
          format: uri-reference
          description: URI of the request that caused the error
          example: /api/v1/copilot/customer/chat
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2026-07-23T10:30:00+05:30"
