server:
  port: 8098

spring:
  application:
    name: copilot-service

copilot:
  max-session-duration-minutes: 60
  max-message-length: 4000
  streaming-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
