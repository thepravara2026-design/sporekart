server:
  port: 8088

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:h2:mem:ai-service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092

sporekart:
  ai:
    enabled: true
    default-provider: MOCK
    memory-enabled: true
    runtime-enabled: true
    max-retries: 3
    request-timeout: 30s
    max-prompt-length: 32000

    features:
      platform-enabled: true
      gateway-enabled: true
      chat-enabled: true
      rag-enabled: true
      search-enabled: true
      content-enabled: true
      workflow-enabled: true
      monitoring-enabled: true
      provider-gemini: true
      provider-openai: true
      provider-claude: true
      provider-azure-openai: true
      provider-bedrock: false
      provider-ollama: false
      provider-mistral: false
      provider-local-llm: false
      memory-enabled: true
      memory-caching: true
      memory-audit: true
      memory-indexing: true
      runtime-enabled: true
      runtime-caching: true
      runtime-audit: true
      runtime-scheduling: true
      prompt-enabled: true
      prompt-caching: true
      prompt-audit: true
      knowledge-enabled: true
      knowledge-caching: true
      knowledge-audit: true
      semantic-enabled: true
      semantic-caching: true
      semantic-audit: true
      semantic-embedding: true
      semantic-indexing: true
      semantic-search: true
      semantic-ranking: true
      vector-index-enabled: true
      hybrid-search-enabled: true
      conversation-enabled: true
      conversation-caching: true
      conversation-audit: true
      conversation-session: true
      conversation-memory: true
      conversation-streaming: true
      conversation-rate-limit: true
      conversation-monitoring: true
      assistant-enabled: true
      assistant-caching: true
      assistant-monitoring: true
      assistant-audit: true
      governance-enabled: true
      governance-caching: true
      governance-audit: true
      governance-monitoring: true
      policy-enabled: true
      policy-caching: true
      policy-audit: true
      policy-monitoring: true
      policy-evaluation: true
      request-logging: true
      rate-limiting: true
      metrics: true
      approval-enabled: true
      approval-caching: true
      approval-audit: true
      approval-monitoring: true
      compliance-enabled: true
      compliance-caching: true
      compliance-audit: true
      compliance-monitoring: true
      risk-enabled: true
      risk-caching: true
      risk-audit: true
      risk-monitoring: true
      analytics-enabled: true
      analytics-caching: true
      analytics-audit: true
      analytics-monitoring: true
      admin-enabled: true
      admin-caching: true
      admin-audit: true
      admin-monitoring: true
      automation-enabled: true
      automation-caching: true
      automation-audit: true
      automation-monitoring: true
      ai-enabled: true
      gateway-enabled: true
      prompt-registry-enabled: true
      conversation-enabled: true
      knowledge-enabled: true
      semantic-search-enabled: true
      embeddings-enabled: true
      copilots-enabled: true
      analytics-enabled: true
      monitoring-enabled: true
      provider-failover-enabled: true
      rate-limiter-enabled: true
      streaming-enabled: true
      image-generation-enabled: true
      audio-enabled: true
      vision-enabled: true
      reasoning-models-enabled: true

    gateway:
      enabled: true
      base-path: /api/v1/ai
      request-timeout: 60s
      max-request-size: 32000
      rate-limiter-enabled: true
      rate-limit-requests-per-minute: 100
      rate-limit-burst: 20
      circuit-breaker-enabled: true
      circuit-breaker-threshold: 5
      circuit-breaker-reset-timeout: 30s
      audit-enabled: true
      caching-enabled: true
      cache-ttl: 5m
      streaming-enabled: true
      max-streaming-duration: 120

    runtime:
      enabled: true
      max-agent-executions: 1000
      max-execution-duration-seconds: 300
      dynamic-model-switching: true
      provider-priority-enabled: true
      traffic-routing-enabled: false
      canary-rollout-enabled: false
      canary-traffic-percent: 10.0
      emergency-disable-enabled: true
      maintenance-mode: false
      request-timeout: 60s
      circuit-breaker-threshold: 5
      circuit-breaker-reset-timeout: 30s
      max-retries: 3
      retry-backoff: 1s
      max-concurrency: 50
      batch-size: 10
      streaming-mode: true
      hot-reload-enabled: true
      hot-reload-interval: 30s

    prompt:
      enabled: true
      caching-enabled: true
      cache-ttl: 1h
      versioning-enabled: true
      approval-workflow-enabled: true
      audit-enabled: true
      template-validation-enabled: true
      injection-detection-enabled: true
      max-prompt-length: 32000
      max-template-variables: 50
      import-export-enabled: true

    embedding:
      enabled: true
      default-provider: openai
      default-model: text-embedding-3-small
      embedding-dimension: 1536
      batch-size: 20
      cache-ttl: 24h
      normalize-embeddings: true
      caching-enabled: true
      fallback-enabled: true
      fallback-provider: gemini
      fallback-model: embedding-001

    semantic:
      enabled: true
      default-search-type: HYBRID
      default-limit: 10
      rrf-constant: 60
      semantic-weight: 0.7
      keyword-weight: 0.3
      hybrid-search-enabled: true
      cross-encoder-enabled: false
      multi-vector-enabled: false
      contextual-search-enabled: true
      caching-enabled: true
      search-cache-ttl: 5m
      embedding-cache-ttl: 24h
      rate-limit-per-minute: 100
      audit-enabled: true

    conversation:
      enabled: true
      caching-enabled: true
      session-cache-ttl: 30m
      message-cache-ttl: 15m
      context-cache-ttl: 10m
      session-timeout-minutes: 30
      max-context-entries: 50
      max-message-length: 10000
      streaming-enabled: true
      memory-enabled: true
      short-term-memory-ttl: 24h
      audit-enabled: true
      input-sanitization-enabled: true
      rate-limiter-enabled: true
      rate-limit-per-minute: 60

    memory:
      enabled: true
      caching-enabled: true
      cache-ttl: 30m
      vector-indexing-enabled: true
      consolidation-enabled: true
      short-term-ttl: 24h
      long-term-ttl: 90d
      max-short-term-entries: 100
      max-long-term-entries: 10000
      importance-scoring-enabled: true
      importance-threshold: 0.3
      pruning-enabled: true
      pruning-interval: 6h
      audit-enabled: true

    analytics:
      enabled: true
      metrics-enabled: true
      tracing-enabled: true
      audit-logging-enabled: true
      usage-tracking-enabled: true
      cost-tracking-enabled: true
      metrics-export-interval: 30s
      trace-export-interval: 60s
      anomaly-detection-enabled: false
      dashboard-enabled: true
      realtime-enabled: false
      data-retention-days: 90
      metrics-backend: prometheus
      tracing-backend: jaeger

    security:
      enabled: true
      rate-limiter-enabled: true
      rate-limit-requests-per-minute: 100
      rate-limit-burst: 20
      input-validation-enabled: true
      content-moderation-enabled: true
      audit-enabled: true
      encryption-enabled: false
      secret-management-enabled: true
      secret-provider-type: environment
      token-expiry: 1h
      cors-enabled: true
      csrf-enabled: true
      rbac-enabled: true
      mfa-enabled: false

    monitoring:
      enabled: true
      metrics-enabled: true
      tracing-enabled: true
      health-check-enabled: true
      logging-enabled: true
      audit-enabled: true
      alerting-enabled: true
      metrics-provider: prometheus
      tracing-provider: jaeger
      logging-provider: logback
      alerting-provider: pagerduty
      metrics-export-interval: 30s
      trace-export-interval: 60s
      health-check-interval: 30s
      sentry-enabled: true
      prometheus-enabled: true
      grafana-enabled: true
      open-telemetry-enabled: true

    observability:
      logging-enabled: true
      metrics-enabled: true
      tracing-enabled: true
      health-enabled: true
      audit-enabled: true
      sentry-enabled: true
      prometheus-enabled: true
      grafana-enabled: true
      open-telemetry-enabled: true
      metrics-export-interval: 30s
      trace-export-interval: 60s
      health-check-interval: 30s
      logging-level: INFO
      metrics-backend: prometheus
      tracing-backend: jaeger

    cache:
      enabled: true
      default-ttl: 30m
      key-prefix: "ai:"
      versioning-enabled: true
      refresh-strategy: CACHE_ASIDE
      ttl-overrides:
        config: 5m
        feature: 10m
        provider: 5m
        secret: 1m

    provider:
      default-provider: openai
      failover-enabled: true
      health-check-interval-seconds: 30
      provider-order: openai, gemini, claude, azure, bedrock, ollama, openrouter
      providers:
        GEMINI:
          enabled: true
          endpoint: https://generativelanguage.googleapis.com
          model: gemini-pro
          max-tokens: 2048
          temperature: 0.7
        OPENAI:
          enabled: true
          endpoint: https://api.openai.com
          model: gpt-4
          max-tokens: 2048
          temperature: 0.7
        CLAUDE:
          enabled: true
          endpoint: https://api.anthropic.com
          model: claude-3-sonnet
          max-tokens: 2048
          temperature: 0.7

    configuration:
      enabled: true
      validation-enabled: true
      cache-enabled: true
      cache-ttl: 5m
      secret-management-enabled: true
      multi-tenant-enabled: false
      hot-reload-enabled: true
      environment-override-enabled: true
      audit-enabled: true

    modules:
      core:
        enabled: true
      gateway:
        enabled: true
        rate-limit: 100
      provider:
        enabled: true
      prompt:
        enabled: true
      rag:
        enabled: true
      search:
        enabled: true
      chat:
        enabled: true
        rate-limit: 50
      content:
        enabled: true
        generation:
          max-length: 2000
          default-tone: neutral
        cache:
          ttl-minutes: 15
      workflow:
        enabled: true
        execution-timeout-ms: 300000
        max-retries: 3
        cache-ttl-minutes: 30
        scheduler-enabled: true
      monitoring:
        enabled: true
      knowledge:
        enabled: true
      semantic:
        enabled: true
        embedding:
          default-provider: OPENAI
          default-model: text-embedding-ada-002
          dimensions: 1536
        search:
          default-threshold: 0.7
          max-results: 50
        cache:
          embedding-ttl: 30
          search-ttl: 5
      conversation:
        enabled: true
        session-ttl-hours: 24
        message-limit: 1000
        context-size: 10
        streaming-enabled: true
      assistant:
        enabled: true
        session:
          ttl-hours: 24
          max-sessions-per-user: 50
        intent:
          min-confidence: 0.3
          multi-intent-enabled: true
        task:
          max-retries: 3
          default-timeout-ms: 30000
          max-tasks-per-plan: 10
      governance:
        enabled: true
        mode: DEVELOPMENT
        default-decision: ALLOW
        cache:
          config-ttl-seconds: 300
          registry-ttl-seconds: 300
          health-ttl-seconds: 60
          metrics-ttl-seconds: 120
          validation-ttl-seconds: 180
        kafka:
          topic: governance-events
          partitions: 3
          replication-factor: 1
      decision-enabled: true
      decision-caching: true
      decision-audit: true
      decision-monitoring: true
      decision:
        enabled: true
        default-action: ALLOW
        default-conflict-strategy: DENY_OVERRIDES
        cache:
          result-ttl-seconds: 300
          metadata-ttl-seconds: 300
          registry-ttl-seconds: 300
          statistics-ttl-seconds: 120
          explanation-ttl-seconds: 300
        kafka:
          topic: decision-events
          partitions: 3
          replication-factor: 1
      approval:
        enabled: true
        default-sla-minutes: 60
        max-levels: 3
        cache:
          pending-ttl-seconds: 60
          assignment-ttl-seconds: 120
          config-ttl-seconds: 300
          workflow-ttl-seconds: 300
          statistics-ttl-seconds: 120
        kafka:
          topic: approval-events
          partitions: 3
          replication-factor: 1
      compliance:
        enabled: true
        default-framework: INTERNAL_AI_GOVERNANCE
        default-evidence-verification: true
        cache:
          rules-ttl-seconds: 300
          frameworks-ttl-seconds: 300
          validation-ttl-seconds: 180
          reports-ttl-seconds: 300
          statistics-ttl-seconds: 120
        kafka:
          topic: compliance-events
          partitions: 3
          replication-factor: 1
      risk:
        enabled: true
        scoring:
          default-risk-score: 50.0
        trust:
          default-trust-score: 75.0
        confidence:
          default-confidence: 70.0
        cache:
          scores-ttl-seconds: 300
          trust-ttl-seconds: 300
          confidence-ttl-seconds: 300
          thresholds-ttl-seconds: 600
          metadata-ttl-seconds: 300
        kafka:
          topic: risk-events
          partitions: 3
          replication-factor: 1
      analytics:
        enabled: true
        export:
          supported-formats: JSON,CSV
          max-file-size: 10485760
        cache:
          dashboard-ttl-seconds: 300
          metrics-ttl-seconds: 120
          kpis-ttl-seconds: 300
          reports-ttl-seconds: 300
          statistics-ttl-seconds: 120
        kafka:
          topic: analytics-events
          partitions: 3
          replication-factor: 1
      admin:
        enabled: true
        cache:
          config-ttl-seconds: 300
          flags-ttl-seconds: 300
          env-ttl-seconds: 600
          snapshot-ttl-seconds: 600
          metadata-ttl-seconds: 300
        kafka:
          topic: admin-events
          partitions: 3
          replication-factor: 1
      automation:
        enabled: true
        scheduler:
          enabled: true
          poll-interval-ms: 60000
        retry:
          default-max-retries: 3
          default-backoff-ms: 1000
          default-backoff-multiplier: 2.0
        cache:
          workflow-ttl-seconds: 300
          scheduler-ttl-seconds: 300
          lifecycle-ttl-seconds: 600
          config-ttl-seconds: 300
          statistics-ttl-seconds: 120
        kafka:
          topic: automation-events
          partitions: 3
          replication-factor: 1
      provider-registry:
        enabled: true
      prompt-registry:
        enabled: true
      knowledge-registry:
        enabled: true
      usage-tracking:
        enabled: true
      config-registry:
        enabled: true
      event-catalog:
        enabled: true
      api-registry:
        enabled: true
      capability-discovery:
        enabled: true
      memory:
        enabled: true
        default-max-results: 50
        default-ttl: 30d
        consolidation:
          enabled: true
          schedule: "0 0 2 * * ?"
          retention-days: 90
        indexing:
          enabled: true
          vector-dimension: 1536
          index-type: HNSW
        cache:
          entry-ttl-seconds: 300
          query-ttl-seconds: 120
          stats-ttl-seconds: 600
        kafka:
          topic: ai-memory-events
          partitions: 3
          replication-factor: 1
      agent-runtime:
        enabled: true
        max-agents: 100
        execution-timeout: 5m
        max-iterations: 25
        execution:
          async-enabled: true
          max-concurrent-executions: 50
          retry-enabled: true
          max-retries: 3
        scheduling:
          enabled: true
          thread-pool-size: 4
        cache:
          definition-ttl-seconds: 300
          execution-ttl-seconds: 600
          schedule-ttl-seconds: 300
          metrics-ttl-seconds: 120
        kafka:
          topic: ai-runtime-events
          partitions: 3
          replication-factor: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
