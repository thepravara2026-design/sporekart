server:
  port: 8088

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_service_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ai_service}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE-ME}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    com.sporekart.ai: DEBUG
    org.springframework: INFO

sporekart:
  ai:
    mode: DEVELOPMENT
