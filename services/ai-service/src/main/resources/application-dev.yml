spring:
  datasource:
    url: jdbc:postgresql://dev-db:5432/ai_service
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  redis:
    host: dev-redis
    port: 6379
  kafka:
    bootstrap-servers: dev-kafka:9092

sporekart:
  ai:
    configuration:
      environment-override-enabled: true
      secret-management-enabled: true
    features:
      ai-enabled: true
      gateway-enabled: true
      provider-failover-enabled: true
      rate-limiter-enabled: true
      streaming-enabled: true
      analytics-enabled: true
      monitoring-enabled: true
    observability:
      logging-level: DEBUG
      sentry-enabled: false
      prometheus-enabled: true
      grafana-enabled: false
      open-telemetry-enabled: false
    cache:
      enabled: true
      default-ttl: 10m
    runtime:
      hot-reload-enabled: true
      hot-reload-interval: 60s
    security:
      rate-limiter-enabled: true
      content-moderation-enabled: false
      csrf-enabled: true
