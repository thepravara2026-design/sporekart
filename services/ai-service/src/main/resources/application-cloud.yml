sporekart:
  ai:
    configuration:
      environment-override-enabled: true
      secret-management-enabled: true
      multi-tenant-enabled: true
    cache:
      enabled: true
      default-ttl: 2m
      refresh-strategy: REFRESH_AHEAD
    observability:
      logging-level: INFO
      sentry-enabled: true
      prometheus-enabled: true
      open-telemetry-enabled: true
    runtime:
      hot-reload-enabled: true
      hot-reload-interval: 15s
    provider:
      failover-enabled: true
      health-check-interval-seconds: 15

spring:
  datasource:
    url: ${AI_DATABASE_URL}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  redis:
    host: ${AI_REDIS_HOST}
    port: ${AI_REDIS_PORT}
    password: ${AI_REDIS_PASSWORD}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  kafka:
    bootstrap-servers: ${AI_KAFKA_SERVERS}
    properties:
      security:
        protocol: SSL
    producer:
      acks: all
      compression-type: snappy
      retries: 3
    consumer:
      group-id: ai-service-cloud
      auto-offset-reset: latest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      environment: cloud
      service: ai-service
