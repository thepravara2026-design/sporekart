sporekart:
  ai:
    configuration:
      environment-override-enabled: true
      secret-management-enabled: true
      multi-tenant-enabled: false
    cache:
      enabled: true
      default-ttl: 5m
    observability:
      logging-level: DEBUG
      sentry-enabled: true
      prometheus-enabled: true

spring:
  datasource:
    url: jdbc:postgresql://stage-db:5432/ai_service
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  redis:
    host: stage-redis
    port: 6379
  kafka:
    bootstrap-servers: stage-kafka:9092
  flyway:
    enabled: true
