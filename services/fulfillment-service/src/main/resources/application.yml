spring:
  application:
    name: fulfillment-service
  datasource:
    url: jdbc:h2:mem:fulfillment-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8086
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
