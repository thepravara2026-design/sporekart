spring:
  application:
    name: admin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/CHANGE-ME}
    username: ${SPRING_DATASOURCE_USERNAME:CHANGE-ME}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE-ME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
server:
  port: 8089
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
