spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:h2:mem:admin-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
server:
  port: 8089
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
