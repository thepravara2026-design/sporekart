server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      enabled: true
      routes: []
  redis:
    host: localhost
    port: 6379
    timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

sporekart:
  gateway:
    enabled: true
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      max-age: 3600
    security:
      jwt-enabled: true
      require-authentication: true
      public-paths:
        - /actuator/health/**
        - /actuator/info
        - /api/public/**
        - /webjars/**
        - /v3/api-docs/**
        - /swagger-ui/**
      jwk-set-uri: http://localhost:8081/.well-known/jwks.json
    rate-limiter:
      enabled: true
      default-permit-per-second: 100
      default-burst-capacity: 200
    routing:
      service-timeout: 30s
      max-header-size: 8192
      max-request-size: 10MB
    security-headers:
      hsts-enabled: true
      hsts-max-age: 31536000
      hsts-include-subdomains: true
      csp-enabled: true
      csp-policy: "default-src 'self'"
      xss-protection: true
      content-type-options: true
      frame-options: DENY
    observability:
      metrics-enabled: true
      tracing-enabled: true
      audit-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      show-components: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - url: /v3/api-docs
        name: Enterprise API Gateway

