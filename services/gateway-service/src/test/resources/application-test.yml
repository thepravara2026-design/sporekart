server:
  port: 0

spring:
  application:
    name: gateway-service-test
  cloud:
    gateway:
      enabled: true
      default-filters: []
      routes: []
  redis:
    host: localhost
    port: 6379
    timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

sporekart:
  gateway:
    enabled: true
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      max-age: 3600
    security:
      jwt-enabled: true
      require-authentication: true
      jwt-secret: test-jwt-secret-key-for-hmac-signing-in-tests-only
      public-paths:
        - /actuator/health/**
        - /actuator/info
        - /api/public/**
        - /webjars/**
        - /v3/api-docs/**
        - /swagger-ui/**
    rate-limiter:
      enabled: false
    routing:
      service-timeout: 5s
      max-header-size: 8192
      max-request-size: 1MB
    security-headers:
      hsts-enabled: true
      hsts-max-age: 31536000
      hsts-include-subdomains: true
      csp-enabled: true
      csp-policy: "default-src 'self'"
      xss-protection: true
      content-type-options: true
      frame-options: DENY
    observability:
      metrics-enabled: true
      tracing-enabled: false
      audit-enabled: true
    services:
      copilot-marketplace:
        url: http://localhost:8098
        health-path: /actuator/health
        timeout: 10s
      customer-copilot:
        url: http://localhost:8200
        health-path: /actuator/health
        timeout: 30s
      admin-copilot:
        url: http://localhost:8201
        health-path: /actuator/health
        timeout: 30s
      trainer-copilot:
        url: http://localhost:8202
        health-path: /actuator/health
        timeout: 30s
      grower-copilot:
        url: http://localhost:8203
        health-path: /actuator/health
        timeout: 30s
      marketing-copilot:
        url: http://localhost:8204
        health-path: /actuator/health
        timeout: 30s
      operations-copilot:
        url: http://localhost:8205
        health-path: /actuator/health
        timeout: 30s
      executive-copilot:
        url: http://localhost:8206
        health-path: /actuator/health
        timeout: 30s
      bi-copilot:
        url: http://localhost:8104
        health-path: /actuator/health
        timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sporekart: DEBUG
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
