server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:test-memory;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

sporekart:
  memory:
    enabled: true
    vector-provider: MEMORY

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sporekart: DEBUG
    org.springframework.security: WARN
