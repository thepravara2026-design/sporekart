spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379
logging:
  level:
    root: WARN

app:
  security:
    jwt:
      secret: test-jwt-secret-key-for-hmac-signing-minimum-32-bytes!
      issuer: https://identity.sporekart.test
      expiration-minutes: 15
      refresh-expiration-minutes: 10080
      clock-skew-seconds: 5
