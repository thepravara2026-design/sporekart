spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/CHANGE-ME}
    username: ${SPRING_DATASOURCE_USERNAME:CHANGE-ME}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE-ME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
