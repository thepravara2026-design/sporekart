server:
  port: 8102

spring:
  application:
    name: grower-copilot-service
  datasource:
    url: jdbc:h2:mem:grower-copilot-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sporekart:
  grower:
    copilot:
      default-spawn-rate: 5
      default-region: temperate
      climate-types: temperate,tropical,arid,continental
      max-cultivation-cycles: 12
      ai-model: gpt-4o
