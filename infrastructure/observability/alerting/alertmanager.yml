global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}
  pagerduty_url: https://events.pagerduty.com/v2/enqueue
  pagerduty_routing_key: ${PAGERDUTY_ROUTING_KEY}

route:
  receiver: default
  group_by: [alertname, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      repeat_interval: 15m
      continue: true
    - match:
        severity: warning
      receiver: slack-warning
      repeat_interval: 1h
    - match:
        severity: info
      receiver: slack-info
      repeat_interval: 4h
    - match:
        service: ai-platform
      receiver: slack-ai
      group_by: [alertname, service]
    - match:
        service: event-platform
      receiver: slack-events
      group_by: [alertname, service]
    - match:
        tag: security
      receiver: slack-security
      repeat_interval: 5m

receivers:
  - name: default
    slack_configs:
      - channel: '#sporekart-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        client: SporeKart Monitoring
        client_url: '{{ .ExternalURL }}'
        images:
          - src: https://sporekart.com/logo.png

  - name: slack-warning
    slack_configs:
      - channel: '#sporekart-warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: warning

  - name: slack-info
    slack_configs:
      - channel: '#sporekart-info'
        title: '[INFO] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: good

  - name: slack-ai
    slack_configs:
      - channel: '#sporekart-ai'
        title: '[AI] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '#7B68EE'

  - name: slack-events
    slack_configs:
      - channel: '#sporekart-events'
        title: '[EVENTS] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '#20B2AA'

  - name: slack-security
    slack_configs:
      - channel: '#sporekart-security'
        title: '[SECURITY] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: danger
