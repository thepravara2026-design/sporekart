groups:
  - name: sporekart-sre
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"sporekart.*"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Service {{ $labels.job }} is down'
          description: '{{ $labels.job }} has been unreachable for more than 1 minute'

      - alert: HighErrorBudgetBurn
        expr: |
          (1 - (rate(http_server_requests_seconds_count{status=~"5.."}[1h])
          / rate(http_server_requests_seconds_count[1h]))) < 0.999
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Error budget burn rate critical'
          description: 'Error budget is being consumed at >10x rate for the last hour'

      - alert: SLOViolation
        expr: |
          histogram_quantile(0.95,
            rate(http_server_request_duration_seconds_bucket[5m])
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: 'SLO violation: API latency exceeds 200ms P95'
          description: 'P95 API latency is {{ $value }}s, exceeding SLO of 200ms'

      - alert: AICompletionSLO
        expr: |
          histogram_quantile(0.95,
            rate(ai_completion_time_seconds_bucket[5m])
          ) > 3.0
        for: 5m
        labels:
          severity: warning
          team: sre
          service: ai-platform
        annotations:
          summary: 'AI completion SLO violation'
          description: 'P95 AI completion time is {{ $value }}s, exceeding SLO of 3s'

      - alert: DatabaseQuerySLO
        expr: |
          histogram_quantile(0.95,
            rate(db_query_duration_seconds_bucket[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: 'Database query SLO violation'
          description: 'P95 DB query time is {{ $value }}s, exceeding SLO of 50ms'

      - alert: AvailabilityDrop
        expr: |
          avg_over_time(probe_success[1h]) < 0.999
        for: 10m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Availability dropping below 99.9%'
          description: 'Current availability is {{ $value | humanizePercentage }}'

      - alert: BurnRateAlert
        expr: |
          (1 - (sum(rate(http_server_requests_seconds_count{status=~"5.."}[1h]))
          / sum(rate(http_server_requests_seconds_count[1h])))) < 0.99
        for: 2m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'High error budget burn rate'
          description: 'Error budget burning at >10x for 1h window'

      - alert: ErrorBudgetExhausted
        expr: |
          (1 - (sum(rate(http_server_requests_seconds_count{status=~"5.."}[30d]))
          / sum(rate(http_server_requests_seconds_count[30d])))) < 0.999
        for: 1h
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Monthly error budget exhausted'
          description: 'Error budget for 30-day window is exhausted'

      - alert: ContainerRestartLoop
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Container restart loop detected'
          description: 'Container {{ $labels.container }} restarting frequently'

      - alert: PodCrashLooping
        expr: kube_pod_status_phase{phase="CrashLoopBackOff"} == 1
        for: 2m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Pod in CrashLoopBackOff'
          description: 'Pod {{ $labels.pod }} is crash looping'

      - alert: QueueOverflow
        expr: sporekart_events_queue_length > 10000
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: 'Event queue overflow'
          description: 'Event queue length is {{ $value }}, threshold 10000'

      - alert: DLQGrowth
        expr: rate(sporekart_events_dlq_total[1h]) > 10
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: 'Dead letter queue growing'
          description: 'DLQ growth rate is {{ $value }} events/hour'

      - alert: HealthCheckFailure
        expr: probe_success{job="sporekart-health"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Health check probe failed'
          description: 'Health endpoint {{ $labels.instance }} is unreachable'

      - alert: IncidentDetected
        expr: |
          (rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
          OR
          histogram_quantile(0.99, rate(http_server_request_duration_seconds_bucket[5m])) > 1.0)
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: 'Incident detected - multiple thresholds breached'
          description: 'Error rate elevated and P99 latency exceeds 1s'
