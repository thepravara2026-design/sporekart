sporekart:
  tracing:
    enabled: true
    exporter: otlp
    sampling-rate: 0.1
    head-sampling-rate: 0.05

management:
  tracing:
    sampling:
      probability: 0.1
  observations:
    key-values:
      application: sporekart
      environment: ${SPRING_PROFILES_ACTIVE:development}

spring:
  application:
    name: ${spring.application.name:sporekart}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-}] [%X{spanId:-}] - %msg%n"
  level:
    io.micrometer.tracing: DEBUG
    org.springframework.web.servlet: INFO
