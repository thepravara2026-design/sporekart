## Graceful Shutdown

All services must implement graceful shutdown:

```yaml
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 15"]
```

Spring Boot configuration:
```yaml
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
```

## Health Indicator Dependencies

| Health Indicator | Critical | Degraded on Failure | Services |
|-----------------|----------|--------------------|----------|
| Database | ✅ | No | All persistence services |
| Redis | ✅ | No | identity, session, cache |
| Kafka | ❌ | Yes | ai-service |
| AI Providers | ❌ | Yes | ai-service |
| Disk Space | ❌ | Yes | All services |
| Ping | ✅ | No | All services |

## Dockerfile HEALTHCHECK

```dockerfile
HEALTHCHECK --interval=30s --timeout=10s --retries=3 --start-period=30s \
  CMD wget -qO- http://localhost:8080/actuator/health/liveness || exit 1
```

## Verification

```bash
# Manual health check
curl -s http://localhost:8080/actuator/health | jq

# Detailed health with components
curl -s http://localhost:8080/actuator/health | jq '.components'

# Liveness
curl -s http://localhost:8080/actuator/health/liveness | jq

# Readiness
curl -s http://localhost:8080/actuator/health/readiness | jq
```
