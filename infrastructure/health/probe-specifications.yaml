# SporeKart Enterprise Docker Health Probes
# Standardized health, readiness, liveness, and startup probes

## Probe Specifications

All services must expose Spring Boot Actuator endpoints:

| Probe | Endpoint | Purpose | Failure Consequence |
|-------|----------|---------|---------------------|
| Startup | GET /actuator/health | Application initialized successfully | Container restarted |
| Liveness | GET /actuator/health/liveness | Application is running | Container restarted |
| Readiness | GET /actuator/health/readiness | Application ready to serve traffic | Removed from service |

## Probe Configuration by Service Tier

### Critical Tier (gateway, identity, order, payment, ai)

```yaml
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 36  # 6 minutes max startup time
```

### Standard Tier (catalog, cart, inventory, notification, fulfillment)

