# SporeKart — Production Nginx Configuration
# Sprint E (Production Hardening) — P0-03: Security Headers

upstream web_app {
    server web-app:4173;
}

server {
    listen 80;
    server_name sporekart.com www.sporekart.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sporekart.com www.sporekart.com;

    # SSL (configure with certbot/cert-manager)
    ssl_certificate     /etc/ssl/certs/sporekart.crt;
    ssl_certificate_key /etc/ssl/private/sporekart.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security Headers
    include /etc/nginx/conf.d/security-headers.conf;

    # HSTS (1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate Limiting (PRR-C06)
    include /etc/nginx/conf.d/rate-limiting.conf;

    # Root
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Static assets (fingerprinted — cache forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files
    location /robots.txt { expires 1d; access_log off; }
    location /sitemap.xml { expires 1d; access_log off; }
    location /manifest.json { expires 1d; access_log off; }
    location /favicon.ico { expires 1y; access_log off; }
    location /apple-touch-icon.png { expires 1y; access_log off; }
    location /og-image.png { expires 1y; access_log off; }

    # Health check
    location /health {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # API proxy (future use)
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SPA: serve index.html for non-file routes
        error_page 404 = /index.html;
    }
}
