route:
  group_by: ["alertname", "severity", "app"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: critical-team
  routes:
    - match:
        severity: critical
      receiver: critical-team
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning-team
      repeat_interval: 4h

receivers:
  - name: critical-team
    slack_configs:
      - api_url: "https://hooks.slack.com/services/CHANGE-ME"
        channel: "#sporekart-alerts"
        title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true
    pagerduty_configs:
      - routing_key: "CHANGE-ME"
        severity: critical

  - name: warning-team
    slack_configs:
      - api_url: "https://hooks.slack.com/services/CHANGE-ME"
        channel: "#sporekart-alerts"
        title: "⚠️ [WARNING] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true
