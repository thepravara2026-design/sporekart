apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: sporekart-observability
data:
  sporekart-overview.json: |
    {
      "title": "SporeKart Platform Overview",
      "panels": [
        {"title": "Service Uptime", "type": "stat", "datasource": "Prometheus", "targets": [{"expr": "up"}]},
        {"title": "Request Rate", "type": "graph", "datasource": "Prometheus", "targets": [{"expr": "rate(http_server_requests_seconds_count[5m])"}]},
        {"title": "Error Rate", "type": "graph", "datasource": "Prometheus", "targets": [{"expr": "rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])"}]},
        {"title": "P99 Latency", "type": "graph", "datasource": "Prometheus", "targets": [{"expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m]))"}]},
        {"title": "JVM Heap Usage", "type": "graph", "datasource": "Prometheus", "targets": [{"expr": "jvm_memory_used_bytes{area=\"heap\"}"}]},
        {"title": "CPU Usage", "type": "graph", "datasource": "Prometheus", "targets": [{"expr": "rate(process_cpu_usage[5m])"}]}
      ]
    }
