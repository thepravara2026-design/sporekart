groups:
  - name: sporekart-service-down
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.app }} is down in {{ $labels.kubernetes_namespace }}"
          description: "{{ $labels.app }} has been unreachable for more than 1 minute."

  - name: sporekart-high-latency
    interval: 30s
    rules:
      - alert: HighLatency
        expr: http_server_requests_seconds_max > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected on {{ $labels.app }}"
          description: "P99 latency exceeds 1 second for 5 minutes."

  - name: sporekart-error-rate
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Error rate > 5% on {{ $labels.app }}"
          description: "5xx error rate is {{ $value | humanizePercentage }}"

  - name: sporekart-resource-pressure
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap memory > 85% on {{ $labels.app }}"
          description: "JVM heap is {{ $value | humanizePercentage }} used"

      - alert: HighCPUUsage
        expr: rate(process_cpu_usage[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage > 80% on {{ $labels.app }}"

  - name: sporekart-database
    interval: 30s
    rules:
      - alert: DatabaseConnectionDown
        expr: spring_datasource_hikari_connections_active == 0 and spring_datasource_hikari_connections_max > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool exhausted on {{ $labels.app }}"

  - name: sporekart-flyway
    interval: 60s
    rules:
      - alert: FlywayMigrationPending
        expr: flyway_migrations_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pending Flyway migrations on {{ $labels.app }}"
          description: "{{ $value }} migrations pending"
