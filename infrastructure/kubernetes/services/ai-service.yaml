apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: sporekart-ai
  labels:
    app: ai-service
    component: ai
    environment: production
    managed-by: terraform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        component: ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: ai
          image: 123456.dkr.ecr.us-east-1.amazonaws.com/sporekart-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sporekart-global-config
            - configMapRef:
                name: sporekart-database-config
            - configMapRef:
                name: sporekart-observability-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sporekart-ai-secrets
                  key: OPENAI_API_KEY
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sporekart-ai-secrets
                  key: AZURE_OPENAI_API_KEY
          resources:
            requests:
              cpu: 512m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 36
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: sporekart-ai
  labels:
    app: ai-service
    component: ai
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
