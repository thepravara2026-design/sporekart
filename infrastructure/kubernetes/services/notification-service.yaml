apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: sporekart-services
  labels:
    app: notification-service
    component: notification
    environment: production
    managed-by: terraform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        component: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: notification
          image: 123456.dkr.ecr.us-east-1.amazonaws.com/sporekart-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sporekart-global-config
            - configMapRef:
                name: sporekart-database-config
            - configMapRef:
                name: sporekart-observability-config
          env:
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: sporekart-infra-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: sporekart-infra-secrets
                  key: SMTP_PASS
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
            limits:
              cpu: 256m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: sporekart-services
  labels:
    app: notification-service
    component: notification
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
