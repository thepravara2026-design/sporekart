apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: sporekart-platform
  labels:
    app: identity-service
    component: auth
    environment: production
    managed-by: terraform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        component: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: identity
          image: 123456.dkr.ecr.us-east-1.amazonaws.com/sporekart-identity:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sporekart-global-config
            - configMapRef:
                name: sporekart-database-config
            - configMapRef:
                name: sporekart-observability-config
          env:
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sporekart-secrets
                  key: APP_JWT_SECRET
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sporekart-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: sporekart-platform
  labels:
    app: identity-service
    component: auth
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
