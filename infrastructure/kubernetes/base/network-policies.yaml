apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: sporekart-services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: sporekart-services
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sporekart-platform
          podSelector:
            matchLabels:
              app: gateway-service
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-to-services
  namespace: sporekart-services
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - identity-service
          - catalog-service
          - inventory-service
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sporekart-platform
          podSelector:
            matchLabels:
              app: gateway-service
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-to-services
  namespace: sporekart-ai
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sporekart-platform
          podSelector:
            matchLabels:
              app: gateway-service
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: sporekart-services
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sporekart-observability
          podSelector:
            matchLabels:
              app: prometheus
    - ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: sporekart-services
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sporekart-platform
          podSelector:
            matchLabels:
              app: gateway-service
    - ports:
        - port: 8080
  policyTypes:
    - Ingress
