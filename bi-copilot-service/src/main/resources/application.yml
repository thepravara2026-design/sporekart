spring:
  application:
    name: bi-copilot-service
server:
  port: 8104
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sporekart:
  bi:
    data-retention-days: 365
    forecast-default-horizon: 90
    dashboard-refresh-seconds: 300
    executive-report-format: pdf,html,json
    health-score-weights:
      revenue: 0.25
      customer: 0.20
      training: 0.15
      inventory: 0.15
      operations: 0.15
      growth: 0.10
