# SporeKart — Production Deployment Pipeline
# PRR-C08: End-to-End Deployment Pipeline
# Status: ✅ CONFIGURED — 20-Jul-2026

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sporekart-web-app
  ECS_CLUSTER: sporekart-prod
  ECS_SERVICE: sporekart-web-app

jobs:
  # ---- Job 1: Build & Push ----
  build:
    name: Build and Push Container
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker build -f docker/Dockerfile.web-app -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ---- Job 2: Deploy to ECS ----
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

  # ---- Job 3: Smoke Tests ----
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get ALB DNS
        id: get-dns
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names sporekart-prod-alb \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "dns=$DNS" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          curl -sSf -o /dev/null -w "%{http_code}" \
            https://sporekart.com/health \
            || { echo "Health check failed"; exit 1; }

      - name: Verify auth page loads
        run: |
          curl -sSf -o /dev/null -w "%{http_code}" \
            https://sporekart.com/auth/login \
            || { echo "Auth page failed"; exit 1; }

      - name: Verify CSP headers
        run: |
          CSP=$(curl -sI https://sporekart.com | grep -i 'content-security-policy')
          if [ -z "$CSP" ]; then echo "CSP header missing"; exit 1; fi

      - name: Verify HSTS header
        run: |
          HSTS=$(curl -sI https://sporekart.com | grep -i 'strict-transport-security')
          if [ -z "$HSTS" ]; then echo "HSTS header missing"; exit 1; fi

  # ---- Job 4: Notify ----
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-test]
    if: always()

    steps:
      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_MESSAGE: "SporeKart production deployment (${{ github.event.inputs.image_tag }}): ${{ needs.smoke-test.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
