name: Release — Enterprise Release Orchestration

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      dry_run:
        description: Dry run (no git push)
        required: false
        default: true
        type: boolean

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin

jobs:
  release:
    name: Orchestrate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "sporetest" ]]; then
            echo "❌ Releases must be triggered from sporetest branch"
            exit 1
          fi

      - name: Determine current version
        id: current-version
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -1 || echo "2.0.0")
          echo "version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current-version.outputs.version }}"
          case "${{ github.event.inputs.release_type }}" in
            major) echo "version=$((MAJOR+1)).0.0" >> $GITHUB_OUTPUT ;;
            minor) echo "version=$MAJOR.$((MINOR+1)).0" >> $GITHUB_OUTPUT ;;
            patch) echo "version=$MAJOR.$MINOR.$((PATCH+1))" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set outputs
        id: tag
        run: |
          echo "tag=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "branch=release/v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --format="- %s (%an)" ${PREV_TAG}..HEAD \
              | grep -E "^(feat|fix|docs|refactor|perf|test|build|ci)" \
              | sort > /tmp/release-notes.md
          else
            echo "Initial release" > /tmp/release-notes.md
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update version in POM files
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          NEW_VER="${{ steps.version.outputs.version }}"
          find . -name "pom.xml" -exec sed -i "s|<version>[0-9]*\.[0-9]*\.[0-9]*-SNAPSHOT</version>|<version>${NEW_VER}</version>|g" {} \;
          find . -name "pom.xml" -exec sed -i "s|0\.1\.0-SNAPSHOT|${NEW_VER}|g" {} \;

      - name: Create release branch
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          git config user.name "sporekart-bot"
          git config user.email "bot@sporekart.com"
          git checkout -b "${{ steps.tag.outputs.branch }}"
          git add -A
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.tag.outputs.branch }}"

      - name: Create git tag
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !github.event.inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SporeKart v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release Artifacts
    needs: release
    if: ${{ !github.event.inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build all modules
        run: mvn -B package -DskipTests -Prelease
      - name: Upload release JARs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.release.outputs.version }}
          path: '**/target/*.jar'
          retention-days: 90
