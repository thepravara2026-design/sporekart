version: '3.9'
services:
  # ---- Frontend ----
  web-app:
    build:
      context: ../frontend/web-app
      dockerfile: ../../docker/Dockerfile.web-app
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
      VITE_SENTRY_ENVIRONMENT: production
      VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      VITE_FF_MOCK_MODE: "false"
      VITE_FF_PRODUCTION_MODE: "true"
      VITE_FF_PAYMENT_GATEWAY: stripe
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4173/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # ---- Reverse Proxy ----
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../infrastructure/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    depends_on:
      - web-app
    restart: unless-stopped

  # ---- Infrastructure ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: yes
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
